<title>迷子になった文字</title>


<style>

/* =====================================================
   基本
===================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
}


/* =====================================================
   输入区域
===================================================== */

#inputArea {
    opacity: 1;
    transition: opacity 1s ease;

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 14px;

    z-index: 100;

}


/* =====================================================
   输入框
===================================================== */

#textInput {

    width: 420px;

    max-width: 80vw;

    min-height: 42px;

    max-height: 160px;

    padding:
        8px 4px;

    border: none;

    border-bottom:
        1px solid #222;

    background:
        transparent;

    font-size: 18px;

    line-height: 1.6;

    text-align: center;

    outline: none;

    resize: none;

    overflow-y: hidden;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;

    display: block;

}


#textInput::placeholder {

    color: #999;

    opacity: 1;

}

#shrinkTextLayer {
    position: absolute;
    pointer-events: none;
    white-space: pre-wrap;
    overflow: hidden;
    text-align: center;
    color: #111;
    font-family: Arial, "Noto Sans JP", sans-serif;
    font-size: 18px;
    line-height: 1.6;
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    transform-origin: center center;
    z-index: 2;
}


#textInput.ui-fade-out,
#charCount.ui-fade-out,
#startButton.ui-fade-out {
    opacity: 0;
    transition: opacity 1s ease;
}

#textInput.ui-text-hidden {
    color: transparent !important;
    caret-color: transparent !important;
}

#textInput:focus {

    border-bottom:
        1px solid #222;

}


/* =====================================================
   字数
===================================================== */

#charCount {

    position: static;

    margin-top: -8px;

    font-size: 11px;

    line-height: 1;

    color: #999;

    pointer-events: none;

    height: 14px;

}


/* =====================================================
   开始按钮
===================================================== */

#startButton {

    padding:
        10px 30px;

    border:
        1px solid #222;

    background:
        white;

    font-size: 15px;

    cursor: pointer;

}


#startButton:hover {

    background:
        #111;

    color:
        white;

}


/* =====================================================
   再介绍按钮
===================================================== */

#restartButton {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 120;
    padding: 9px 24px;
    border: 1px solid #222;
    background: rgba(255,255,255,.92);
    color: #222;
    font-size: 13px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .6s ease;
}

#restartButton.show {
    opacity: 1;
    pointer-events: auto;
}

#restartButton:hover {
    background: #111;
    color: #fff;
}

/* =====================================================
   マイゴ字幕区域
===================================================== */

#subtitleArea {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 50;

}


/* =====================================================
   漂浮字幕
===================================================== */

.subtitle {

    position: absolute;
    left: 0;
    top: 0;

    max-width: 28vw;
    box-sizing: border-box;
    text-align: center;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: keep-all;

    font-size: 14px;

    font-weight: normal;

    color: #222;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        translateY(8px);

    transition:
        opacity 0.8s ease,
        transform 3s ease;

    pointer-events: none;

    user-select: none;

}


.subtitle.show {

    opacity: .65;

    transform:
        translate(-50%, -50%)
        translateY(0);

}


.subtitle.hide {

    opacity: 0;

    transform:
        translate(-50%, -50%)
        translateY(-8px);

}


/* =====================================================
   文字
===================================================== */

.particle {

    position: absolute;

    left: 0;
    top: 0;

    font-size: 12px;

    line-height: 1;

    color: #111;

    pointer-events: none;

    user-select: none;

    white-space: nowrap;

    will-change:
        transform,
        opacity;

}


/* =====================================================
   状态文字
===================================================== */

#status {

    position: fixed;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 12px;

    color: #888;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .5s;

}

</style>

/* =====================================================
   字幕随机出现
===================================================== */

function createSubtitle() {


    const text =
        subtitles[
            Math.floor(
                Math.random()
                * subtitles.length
            )
        ];


    const el =
        document.createElement(
            "div"
        );


    el.className =
        "subtitle";


    el.textContent =
        text;


    /*
        字幕只在画面左右两侧出现。
        中央区域固定留给输入框和按钮，避免遮挡。
    */

    let x;
    let y;

    if (Math.random() < 0.5) {
        x = 8 + Math.random() * 20;
    } else {
        x = 72 + Math.random() * 20;
    }

    y = 12 + Math.random() * 76;


    el.style.left =
        x + "%";


    el.style.top =
        y + "%";


    /*
        字体大小随机
    */

    const size =
        12 +
        Math.random() * 5;


    el.style.fontSize =
        size + "px";


    subtitleArea.appendChild(
        el
    );


    /*
        出现
    */

    requestAnimationFrame(
        () => {

            el.classList.add(
                "show"
            );

        }
    );


    /*
        随机停留
    */

    const stayTime =
        1800 +
        Math.random() * 2200;


    setTimeout(
        () => {

            el.classList.remove(
                "show"
            );


            el.classList.add(
                "hide"
            );


            setTimeout(
                () => {

                    el.remove();

                },
                1400
            );


        },
        stayTime
    );

}

/* =====================================================
   创建文字
===================================================== */

function createParticle(
    char,
    x,
    y,
    outside = false
) {


    const el =
        document.createElement(
            "div"
        );


    el.className =
        "particle";


    el.textContent =
        char;


    document.body.appendChild(
        el
    );


    const particle = {

        el: el,

        char: char,

        x: x,

        y: y,

        vx:
            (Math.random() - 0.5)
            * 0.4,

        vy:
            (Math.random() - 0.5)
            * 0.4,

        tx: x,

        ty: y,

        active: true,

        outside: outside,

        opacity: 1,

        seed:
            Math.random() * 10000

    };


    particles.push(
        particle
    );


    return particle;

}


/* =====================================================
   从画面外生成文字
===================================================== */

function createOutsideParticle(
    char
) {


    const side =
        Math.floor(
            Math.random() * 4
        );


    const margin = 100;


    let x;

    let y;


    if (
        side === 0
    ) {

        x = -margin;

        y =
            Math.random()
            * window.innerHeight;

    }


    if (
        side === 1
    ) {

        x =
            window.innerWidth
            + margin;

        y =
            Math.random()
            * window.innerHeight;

    }


    if (
        side === 2
    ) {

        x =
            Math.random()
            * window.innerWidth;

        y = -margin;

    }


    if (
        side === 3
    ) {

        x =
            Math.random()
            * window.innerWidth;

        y =
            window.innerHeight
            + margin;

    }


    const p =
        createParticle(
            char,
            x,
            y,
            true
        );


    const cx =
        window.innerWidth / 2;


    const cy =
        window.innerHeight / 2;


    const dx =
        cx - x;


    const dy =
        cy - y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    p.vx =
        dx / distance
        * 0.45;


    p.vy =
        dy / distance
        * 0.45;


    return p;

}


/* =====================================================
   开始
===================================================== */

function start() {

    if (started) return;

    const inputText =
        input.value.trim();

    const prefecture =
        detectPrefecture(inputText);

    if (!prefecture) {
        showStatus("出身地を教えてください。");
        return;
    }

    regionalMode = true;
    regionalShapeList =
        regionalShapesByPrefecture[prefecture];

    regionalShapeIndex = 0;
    completedShapeCount = 0;
    resetRequested = false;
    restartButton.classList.remove("show");
    started = true;

    stopSubtitles();

    /*
        输入文字动画：
        保持 textarea 中原来的换行和位置，
        用同一个字体排版复制层整体缩小。
    */

    const inputRect =
        input.getBoundingClientRect();

    const inputStyle =
        getComputedStyle(input);

    shrinkTextLayer.style.left =
        (inputRect.left - inputArea.getBoundingClientRect().left) + "px";

    shrinkTextLayer.style.top =
        (inputRect.top - inputArea.getBoundingClientRect().top) + "px";

    shrinkTextLayer.style.width =
        inputRect.width + "px";

    shrinkTextLayer.style.height =
        inputRect.height + "px";

    shrinkTextLayer.style.padding =
        inputStyle.padding;

    shrinkTextLayer.style.boxSizing =
        inputStyle.boxSizing;

    shrinkTextLayer.style.fontFamily =
        inputStyle.fontFamily;

    shrinkTextLayer.style.fontSize =
        inputStyle.fontSize;

    shrinkTextLayer.style.fontWeight =
        inputStyle.fontWeight;

    shrinkTextLayer.style.lineHeight =
        inputStyle.lineHeight;

    shrinkTextLayer.style.letterSpacing =
        inputStyle.letterSpacing;

    shrinkTextLayer.style.textAlign =
        inputStyle.textAlign;

    shrinkTextLayer.style.border =
        "0";

    shrinkTextLayer.style.display =
        "block";

    shrinkTextLayer.textContent =
        inputText;

    /*
        先让复制层完成排版，再记录每个字符的真实位置。
        因为复制层与输入框使用完全相同的文字排版参数，
        所以不会重新排列成另一种布局。
    */
    const textNode =
        shrinkTextLayer.firstChild;

    const charRects = [];

    if (textNode) {

        for (let i = 0; i < textNode.length; i++) {

            const range =
                document.createRange();

            range.setStart(textNode, i);
            range.setEnd(textNode, i + 1);

            const rect =
                range.getBoundingClientRect();

            charRects.push({
                char: textNode.textContent[i],
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            });
        }
    }

    /* 输入框和按钮从点击瞬间开始，在 1 秒内淡出 */
    input.classList.add("ui-fade-out");
    charCount.classList.add("ui-fade-out");
    startButton.classList.add("ui-fade-out");
    input.classList.add("ui-text-hidden");

    shrinkTextLayer.style.transform =
        "translateZ(0) scale(1)";

    shrinkTextLayer.style.transformOrigin =
        "center center";

    window.__inputCharRects =
        charRects;

    window.__inputShrinkCenter = {
        x: inputRect.left + inputRect.width / 2,
        y: inputRect.top + inputRect.height / 2
    };

    phase =
        "shrinking";

    phaseStart =
        performance.now();

    showStatus(
        "文字が迷子になっています……"
    );

    requestAnimationFrame(
        loop
    );

}


/* =====================================================
   生成图案
===================================================== */

function generateShape(
    type
) {


    const points = [];


    const cx =
        window.innerWidth / 2;


    const cy =
        window.innerHeight / 2;


    const scale =
        Math.min(
            window.innerWidth,
            window.innerHeight
        )
        * SHAPE_SIZE_RATIO
        / 2;


    /* =================================================
       苹果
    ================================================= */

    if (
        type === "apple"
    ) {


        const count = 110;


        for (
            let i = 0;
            i < count;
            i++
        ) {


            const t =
                Math.PI * 2
                * i
                / count;


            let x =
                Math.cos(t)
                * scale
                * 0.85;


            let y =
                Math.sin(t)
                * scale
                * 0.9;


            if (
                y < -scale * 0.45 &&
                Math.abs(x)
                < scale * 0.3
            ) {


                y +=
                    scale
                    * 0.13
                    *
                    (
                        1 -
                        Math.abs(x)
                        /
                        (scale * 0.3)
                    );

            }


            points.push({

                x:
                    cx + x,

                y:
                    cy + y

            });

        }


        for (
            let i = 0;
            i < 15;
            i++
        ) {


            points.push({

                x:
                    cx +
                    i * 2,

                y:
                    cy -
                    scale * 0.92 -
                    i * 3

            });

        }

    }


    /* =================================================
       杯子
    ================================================= */

    if (
        type === "cup"
    ) {


        const width =
            scale * 1.35;


        const height =
            scale * 1.25;


        for (
            let i = 0;
            i < 50;
            i++
        ) {


            const t =
                Math.PI * 2
                * i
                / 50;


            points.push({

                x:
                    cx +
                    Math.cos(t)
                    * width
                    * 0.5,

                y:
                    cy -
                    height * 0.45 +
                    Math.sin(t)
                    * 10

            });

        }


        for (
            let i = 0;
            i < 45;
            i++
        ) {


            const t =
                i / 44;


            const y =
                cy -
                height * 0.45 +
                height * 0.9 * t;


            const ratio =
                1 -
                0.18 * t;


            points.push({

                x:
                    cx -
                    width * 0.5
                    * ratio,

                y: y

            });


            points.push({

                x:
                    cx +
                    width * 0.5
                    * ratio,

                y: y

            });

        }


        for (
            let i = 0;
            i < 35;
            i++
        ) {


            const t =
                Math.PI
                * i
                / 34;


            points.push({

                x:
                    cx +
                    Math.cos(t)
                    * width
                    * 0.42,

                y:
                    cy +
                    height * 0.45 +
                    Math.sin(t)
                    * 8

            });

        }


        for (
            let i = 0;
            i < 30;
            i++
        ) {


            const t =
                Math.PI * 1.5 +
                Math.PI * i / 29;


            points.push({

                x:
                    cx +
                    width * 0.55 +
                    Math.cos(t)
                    * width
                    * 0.4,

                y:
                    cy +
                    Math.sin(t)
                    * height
                    * 0.3

            });

        }

    }


    /* =================================================
       房子
    ================================================= */

    if (
        type === "house"
    ) {


        const w =
            scale * 1.55;


        const h =
            scale * 1.3;


        const roof = [

            {
                x: cx,
                y: cy - h
            },

            {
                x:
                    cx -
                    w * 0.7,

                y:
                    cy -
                    h * 0.35
            },

            {
                x:
                    cx -
                    w * 0.7,

                y:
                    cy +
                    h * 0.65
            },

            {
                x:
                    cx +
                    w * 0.7,

                y:
                    cy +
                    h * 0.65
            },

            {
                x:
                    cx +
                    w * 0.7,

                y:
                    cy -
                    h * 0.35
            },

            {
                x: cx,
                y: cy - h
            }

        ];


        for (
            let i = 0;
            i < roof.length - 1;
            i++
        ) {


            addLine(
                points,
                roof[i],
                roof[i + 1],
                25
            );

        }


        addLine(

            points,

            {
                x:
                    cx -
                    w * 0.16,

                y:
                    cy +
                    h * 0.65
            },

            {
                x:
                    cx -
                    w * 0.16,

                y:
                    cy +
                    h * 0.05
            },

            15

        );


        addLine(

            points,

            {
                x:
                    cx +
                    w * 0.16,

                y:
                    cy +
                    h * 0.65
            },

            {
                x:
                    cx +
                    w * 0.16,

                y:
                    cy +
                    h * 0.05
            },

            15

        );


        addLine(

            points,

            {
                x:
                    cx -
                    w * 0.16,

                y:
                    cy +
                    h * 0.05
            },

            {
                x:
                    cx +
                    w * 0.16,

                y:
                    cy +
                    h * 0.05
            },

            12

        );

    }


    /* =================================================
       钥匙
    ================================================= */

    if (
        type === "key"
    ) {


        const r =
            scale * 0.32;


        for (
            let i = 0;
            i < 60;
            i++
        ) {


            const t =
                Math.PI * 2
                * i
                / 60;


            points.push({

                x:
                    cx -
                    scale * 0.45 +
                    Math.cos(t) * r,

                y:
                    cy +
                    Math.sin(t) * r

            });

        }


        addLine(

            points,

            {
                x:
                    cx -
                    scale * 0.12,

                y: cy
            },

            {
                x:
                    cx +
                    scale * 0.85,

                y: cy
            },

            45

        );


        addLine(

            points,

            {
                x:
                    cx +
                    scale * 0.48,

                y: cy
            },

            {
                x:
                    cx +
                    scale * 0.48,

                y:
                    cy +
                    scale * 0.28
            },

            14

        );


        addLine(

            points,

            {
                x:
                    cx +
                    scale * 0.72,

                y: cy
            },

            {
                x:
                    cx +
                    scale * 0.72,

                y:
                    cy +
                    scale * 0.22
            },

            12

        );

    }


    /* =================================================
       花
    ================================================= */

    if (
        type === "flower"
    ) {


        const petals = 5;


        for (
            let p = 0;
            p < petals;
            p++
        ) {


            const angle =
                Math.PI * 2
                * p
                / petals;


            const px =
                cx +
                Math.cos(angle)
                * scale
                * 0.36;


            const py =
                cy +
                Math.sin(angle)
                * scale
                * 0.36;


            for (
                let i = 0;
                i < 35;
                i++
            ) {


                const t =
                    Math.PI * 2
                    * i
                    / 35;


                points.push({

                    x:
                        px +
                        Math.cos(t)
                        * scale
                        * 0.38,

                    y:
                        py +
                        Math.sin(t)
                        * scale
                        * 0.38

                });

            }

        }


        for (
            let i = 0;
            i < 30;
            i++
        ) {


            const t =
                Math.PI * 2
                * i
                / 30;


            points.push({

                x:
                    cx +
                    Math.cos(t)
                    * scale
                    * 0.16,

                y:
                    cy +
                    Math.sin(t)
                    * scale
                    * 0.16

            });

        }

    }


    return points;

}


/* =====================================================
   线段
===================================================== */

function addLine(
    points,
    a,
    b,
    count
) {


    for (
        let i = 0;
        i < count;
        i++
    ) {


        const t =
            i /
            Math.max(
                1,
                count - 1
            );


        points.push({

            x:
                a.x +
                (b.x - a.x)
                * t,

            y:
                a.y +
                (b.y - a.y)
                * t

        });

    }

}

function regionalLine(points, x1, y1, x2, y2, count = 30) {

    addLine(
        points,
        { x: x1, y: y1 },
        { x: x2, y: y2 },
        count
    );

}


function regionalEllipse(points, cx, cy, rx, ry, count = 80) {

    for (let i = 0; i < count; i++) {

        const t = Math.PI * 2 * i / count;

        points.push({
            x: cx + Math.cos(t) * rx,
            y: cy + Math.sin(t) * ry
        });

    }

}


function regionalPolygon(points, vertices, countPerLine = 30) {

    for (let i = 0; i < vertices.length; i++) {

        const a = vertices[i];
        const b = vertices[(i + 1) % vertices.length];

        regionalLine(
            points,
            a.x, a.y,
            b.x, b.y,
            countPerLine
        );

    }

}

            line(cx-s*.32,cy+s*.10,cx-s*.48,cy-s*.48,28);
            line(cx-s*.48,cy-s*.48,cx-s*.30,cy-s*.70,20);
            ellipse(cx-s*.30,cy-s*.66,s*.22,s*.20,40);
            poly([{x:cx-s*.46,y:cy-s*.76},{x:cx-s*.62,y:cy-s*.90},{x:cx-s*.55,y:cy-s*.66}],14);
            poly([{x:cx-s*.15,y:cy-s*.76},{x:cx-s*.03,y:cy-s*.90},{x:cx-s*.05,y:cy-s*.65}],14);
            line(cx-s*.50,cy-s*.67,cx-s*.67,cy-s*.62,12);
            line(cx+s*.46,cy+s*.10,cx+s*.72,cy-s*.05,18);
            line(cx+s*.72,cy-s*.05,cx+s*.78,cy-s*.18,14);
            line(cx-s*.25,cy+s*.43,cx-s*.30,cy+s*.72,14);
            line(cx+s*.20,cy+s*.43,cx+s*.25,cy+s*.72,14);
            break;
        }

        default:
            break;
    }

    return points;
}

function optimizePoints(
    points
) {


    const result = [];


    const minDistance =
        FONT_SIZE * 1.15;


    for (
        const point of points
    ) {


        let valid = true;


        for (
            const p of result
        ) {


            const dx =
                point.x - p.x;


            const dy =
                point.y - p.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                minDistance
            ) {

                valid = false;

                break;

            }

        }


        if (
            valid
        ) {

            result.push(
                point
            );

        }

    }


    return result;

}


/* =====================================================
   设置新的图形
===================================================== */

function setShape() {


    const key = regionalShapeList[regionalShapeIndex];

    let points = generateRegionalShape(key);


    points =
        optimizePoints(
            points
        );


    targetPoints =
        points;


    const active =
        particles.filter(
            p => p.active
        );


    /*
        多出的文字飞出画面
    */

    if (
        active.length >
        points.length
    ) {


        const extras =
            active.slice(
                points.length
            );


        extras.forEach(
            p => {


                p.active =
                    false;


                const cx =
                    window.innerWidth
                    / 2;


                const cy =
                    window.innerHeight
                    / 2;


                const dx =
                    p.x - cx;


                const dy =
                    p.y - cy;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    ) || 1;


                p.vx =
                    dx /
                    distance *
                    2.2;


                p.vy =
                    dy /
                    distance *
                    2.2;

            }
        );

    }


    let usable =
        particles.filter(
            p => p.active
        );


    /*
        =================================================
        【地域物品系统预留位置】

        未来这里可以根据用户输入的出生地：

        例如：

        東京 → 東京タワー / 電車 / 寿司
        京都 → 鳥居 / 抹茶 / 五重塔
        大阪 → たこ焼き / 通天閣 / だんじり

        等生成三个地域物品。

        当前仍然使用 apple / cup / house /
        key / flower 作为测试图形。
        =================================================
    */


    const chars =
        getInputCharacters();


    while (
        usable.length <
        points.length
    ) {


        const char =
            chars[
                Math.floor(
                    Math.random()
                    * chars.length
                )
            ];


        const p =
            createOutsideParticle(
                char
            );


        usable.push(
            p
        );

    }


    const finalParticles =
        particles.filter(
            p => p.active
        );


    for (
        let i = 0;
        i < points.length;
        i++
    ) {


        finalParticles[i].tx =
            points[i].x;


        finalParticles[i].ty =
            points[i].y;

    }


    showStatus(
        "文字が集まっています……"
    );

}


/* =====================================================
   文字游走
===================================================== */

function wander(
    p,
    time
) {


    if (
        p.outside
    ) {


        const cx =
            window.innerWidth / 2;


        const cy =
            window.innerHeight / 2;


        const dx =
            cx - p.x;


        const dy =
            cy - p.y;


        p.vx +=
            dx * 0.000002;


        p.vy +=
            dy * 0.000002;


        if (

            p.x > 0 &&
            p.x <
            window.innerWidth &&

            p.y > 0 &&
            p.y <
            window.innerHeight

        ) {

            p.outside =
                false;

        }

    }


    p.vx +=
        Math.sin(
            time * 0.0003 +
            p.seed
        )
        * 0.0007;


    p.vy +=
        Math.cos(
            time * 0.00025 +
            p.seed
        )
        * 0.0007;


    const speed =
        Math.sqrt(
            p.vx * p.vx +
            p.vy * p.vy
        );


    const maxSpeed =
        0.5;


    if (
        speed >
        maxSpeed
    ) {


        p.vx =
            p.vx /
            speed *
            maxSpeed;


        p.vy =
            p.vy /
            speed *
            maxSpeed;

    }


    p.x +=
        p.vx;


    p.y +=
        p.vy;


    const margin = 5;


    if (
        p.x <
        margin
    ) {


        p.x =
            margin;


        p.vx =
            Math.abs(
                p.vx
            );

    }


    if (
        p.x >
        window.innerWidth -
        margin
    ) {


        p.x =
            window.innerWidth -
            margin;


        p.vx =
            -Math.abs(
                p.vx
            );

    }


    if (
        p.y <
        margin
    ) {


        p.y =
            margin;


        p.vy =
            Math.abs(
                p.vy
            );

    }


    if (
        p.y >
        window.innerHeight -
        margin
    ) {


        p.y =
            window.innerHeight -
            margin;


        p.vy =
            -Math.abs(
                p.vy
            );

    }

}


/* =====================================================
   防止文字重叠
===================================================== */

function avoidOverlap() {


    const active =
        particles.filter(
            p => p.active
        );


    const minDistance =
        FONT_SIZE * 1.05;


    for (
        let i = 0;
        i < active.length;
        i++
    ) {


        for (
            let j = i + 1;
            j < active.length;
            j++
        ) {


            const a =
                active[i];


            const b =
                active[j];


            const dx =
                b.x - a.x;


            const dy =
                b.y - a.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (

                distance > 0 &&
                distance <
                minDistance

            ) {


                const push =
                    (
                        minDistance -
                        distance
                    )
                    * 0.02;


                const nx =
                    dx /
                    distance;


                const ny =
                    dy /
                    distance;


                a.x -=
                    nx * push;


                a.y -=
                    ny * push;


                b.x +=
                    nx * push;


                b.y +=
                    ny * push;

            }

        }

    }

}


/* =====================================================
   向图形移动
===================================================== */

function moveToTarget(
    p
) {


    const dx =
        p.tx - p.x;


    const dy =
        p.ty - p.y;


    p.x +=
        dx * 0.025;


    p.y +=
        dy * 0.025;

}


/* =====================================================
   溃散
===================================================== */

function dissolve() {


    const active =
        particles.filter(
            p => p.active
        );


    active.forEach(
        p => {


            const angle =
                Math.random()
                * Math.PI * 2;


            const speed =
                0.2 +
                Math.random()
                * 0.4;


            p.vx =
                Math.cos(angle)
                * speed;


            p.vy =
                Math.sin(angle)
                * speed;


            p.tx =
                p.x +
                (
                    Math.random()
                    - 0.5
                )
                * 300;


            p.ty =
                p.y +
                (
                    Math.random()
                    - 0.5
                )
                * 300;

        }
    );


    showStatus(
        "文字がまた迷子になります……"
    );

}


/* =====================================================
   删除飞出画面的文字
===================================================== */

function cleanup() {


    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {


        const p =
            particles[i];


        if (

            !p.active &&

            (

                p.x < -200 ||

                p.x >
                window.innerWidth + 200 ||

                p.y < -200 ||

                p.y >
                window.innerHeight + 200

            )

        ) {


            p.el.remove();


            particles.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   状态文字
===================================================== */

function showStatus(
    text
) {


    statusText.textContent =
        text;


    statusText.style.opacity =
        "0.6";


    setTimeout(
        () => {


            statusText.style.opacity =
                "0";


        },
        1500
    );

}


/* =====================================================
   显示文字
===================================================== */

function render(
    p
) {


    const visualScale =
        p.visualScale !== undefined
            ? p.visualScale
            : 1;

    p.el.style.transform =
        `translate3d(
            ${p.x}px,
            ${p.y}px,
            0
        ) scale(${visualScale})`;


    p.el.style.opacity =
        p.opacity;

}


/* =====================================================
   恢复初始状态
===================================================== */

function beginReset() {

    if (!started || resetRequested) return;

    resetRequested = true;
    phase = "resetting";
    phaseStart = performance.now();

    restartButton.classList.remove("show");

    // 所有文字从当前位置向画面外飞出
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    particles.forEach(p => {
        const dx = p.x - cx;
        const dy = p.y - cy;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const speed = 3 + Math.random() * 3;
        p.vx = (dx / d) * speed;
        p.vy = (dy / d) * speed;
        p.active = false;
    });
}


function restoreInitialState() {

    particles.forEach(p => {
        if (p.el) p.el.remove();
    });

    particles = [];
    targetPoints = [];
    regionalShapeIndex = 0;
    completedShapeCount = 0;
    resetRequested = false;
    started = false;
    phase = "wander";
    phaseStart = 0;
    lastTime = 0;

    shrinkTextLayer.textContent = "";
    shrinkTextLayer.style.display = "none";
    shrinkTextLayer.style.transform = "scale(1)";

    input.classList.remove("ui-fade-out", "ui-text-hidden");
    charCount.classList.remove("ui-fade-out");
    startButton.classList.remove("ui-fade-out");
    inputArea.style.display = "flex";
    inputArea.style.opacity = "0";
    requestAnimationFrame(() => { inputArea.style.opacity = "1"; });
    input.value = "";
    input.style.color = "";
    input.style.height = "";

    updateInputHeight();
    updateCharCount();

    restartButton.classList.remove("show");

    startSubtitles();
}


/* =====================================================
   主循环
===================================================== */

function loop(
    time
) {


    if (
        !started
    )
        return;


    if (
        !lastTime
    )
        lastTime =
            time;


    const delta =
        Math.min(
            time - lastTime,
            30
        );


    lastTime =
        time;


    const elapsed =
        time - phaseStart;


    /* =================================================
       ① 恢复初始状态：文字飞出
    ================================================= */

    if (
        phase === "resetting"
    ) {

        const t = Math.min(elapsed / RESET_TIME, 1);

        particles.forEach(p => {
            p.x += p.vx * delta;
            p.y += p.vy * delta;
            p.vx *= 1.035;
            p.vy *= 1.035;
            p.opacity = 1 - t;
            render(p);
        });

        if (elapsed >= RESET_TIME) {
            restoreInitialState();
        }
    }

    /* =================================================
       ② 点击后原地缩小
    ================================================= */

    else if (
        phase === "shrinking"
    ) {

        const t =
            Math.min(
                elapsed / SHRINK_TIME,
                1
            );

        const ease =
            1 - Math.pow(
                1 - t,
                3
            );

        /*
            整个文字层一起缩小。
            18px → 10px 相当于整体 scale 10/18。
        */
        const scale =
            1 - (8 / 18) * ease;

        shrinkTextLayer.style.transform =
            `scale(${scale})`;

        if (
            elapsed >= SHRINK_TIME
        ) {

            const finalScale =
                10 / 18;

            const center =
                window.__inputShrinkCenter;

            const chars =
                window.__inputCharRects || [];

            chars.forEach(p => {

                /*
                    以输入框中心为固定锚点，
                    把每个字符的原始位置整体缩小。
                    字符之间的相对位置完全保留。
                */
                const x =
                    center.x +
                    (p.x - center.x) * finalScale;

                const y =
                    center.y +
                    (p.y - center.y) * finalScale;

                createParticle(
                    p.char,
                    x,
                    y
                );

            });

            shrinkTextLayer.style.display =
                "none";

            input.style.color =
                "";

            inputArea.style.display =
                "none";

            particles.forEach(p => {
                p.visualScale = 1;
            });

            phase =
                "wander";

            phaseStart =
                time;

            restartButton.classList.add("show");
        }
    }

    /* =================================================
       ③ 迷路
    ================================================= */

    else if (
        phase === "wander"
    ) {


        particles.forEach(
            p => {


                if (
                    p.active
                ) {


                    wander(
                        p,
                        time
                    );


                } else {


                    p.x +=
                        p.vx *
                        delta;


                    p.y +=
                        p.vy *
                        delta;


                    p.opacity -=
                        0.005 *
                        delta;

                }


                render(
                    p
                );

            }
        );


        avoidOverlap();


        if (
            elapsed >=
            WANDER_TIME
        ) {


            phase =
                "forming";


            phaseStart =
                time;


            setShape();

        }

    }


    /* =================================================
       ② 形成图形
    ================================================= */

    else if (
        phase === "forming"
    ) {


        particles.forEach(
            p => {


                if (
                    p.active
                ) {


                    moveToTarget(
                        p
                    );


                } else {


                    p.x +=
                        p.vx *
                        delta;


                    p.y +=
                        p.vy *
                        delta;


                    p.opacity -=
                        0.006 *
                        delta;

                }


                render(
                    p
                );

            }
        );


        cleanup();


        if (
            elapsed >=
            FORM_TIME
        ) {

            phase =
                "holding";

            phaseStart =
                time;

        }

    }


    /* =================================================
       ③ 图形保持
    ================================================= */

    else if (
        phase === "holding"
    ) {

        particles.forEach(
            p => render(p)
        );

        if (
            elapsed >=
            HOLD_TIME
        ) {

            dissolve();

            phase =
                "dissolving";

            phaseStart =
                time;

        }

    }


    /* =================================================
       ④ 溃散
    ================================================= */

    else if (
        phase === "dissolving"
    ) {


        particles.forEach(
            p => {


                if (
                    p.active
                ) {


                    const dx =
                        p.tx - p.x;


                    const dy =
                        p.ty - p.y;


                    p.x +=
                        dx * 0.003 +
                        p.vx;


                    p.y +=
                        dy * 0.003 +
                        p.vy;


                    p.vx +=
                        (
                            Math.random()
                            - 0.5
                        )
                        * 0.005;


                    p.vy +=
                        (
                            Math.random()
                            - 0.5
                        )
                        * 0.005;


                } else {


                    p.x +=
                        p.vx *
                        delta;


                    p.y +=
                        p.vy *
                        delta;

                }


                render(
                    p
                );

            }
        );


        avoidOverlap();


        cleanup();


        if (
            elapsed >=
            DISSOLVE_TIME
        ) {


            // 1画面終了
            completedShapeCount++;

            // 9画面（3つの図形を3周）終了後、自動で初期状態へ戻る
            if (completedShapeCount >= 9) {
                beginReset();
            } else {
                regionalShapeIndex =
                    (regionalShapeIndex + 1) %
                    regionalShapeList.length;

                phase =
                    "forming";

                phaseStart =
                    time;

                setShape();
            }

        }

    }


    requestAnimationFrame(
        loop
    );

}


/* =====================================================
   按钮
===================================================== */

startButton.addEventListener(
    "click",
    start
);


/* =====================================================
   再介绍按钮
===================================================== */

restartButton.addEventListener(
    "click",
    () => {
        beginReset();
    }
);


/* =====================================================
   Enter 开始
===================================================== */

input.addEventListener(
    "keydown",
    e => {


        /*
            Enter = 开始

            Shift + Enter = 换行
        */

        if (

            e.key === "Enter" &&
            !e.shiftKey

        ) {


            e.preventDefault();


            start();

        }

    }
);


/* =====================================================
   初始化
===================================================== */

updateInputHeight();

updateCharCount();


/*
    页面打开后
    マイゴ开始在空白画面中说话
*/

startSubtitles();


</script>
